<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d">
<title id="t">Stack</title>
<desc id="d">runtime: Go · Kubernetes · containers; data: Postgres · Kafka · Redis; apis: gRPC · Connect · REST; devx: CI/CD · local loops · green merges; ops: Prometheus · Grafana · alerts that page; also: Python · Java when the job asks</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#5e5e70}.cy{fill:#2a7aad}.fg{fill:#9a9aac}.gr{fill:#2a9a62}.wh{fill:#c4c4d0}.fainter{fill:#2e2e3a}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a7aad" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M16 -40V360M864 -40V360" fill="none" stroke="#2a7aad" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="320" fill="#030305"/>
<rect x="16" y="0" width="848" height="320" fill="url(#grid)"/>
<text x="52" y="44" font-weight="700" fill="#2a7aad" filter="url(#g)" opacity=".8" style="font-size:20px">~/</text>
<text x="52" y="44" font-weight="700" style="font-size:20px"><tspan class="cy">~/</tspan><tspan class="wh">stack</tspan></text>
<text x="828" y="44" text-anchor="end" letter-spacing="2" fill="#48485a" style="font-size:12px">// 02</text>
<line x1="52" y1="58" x2="828" y2="58" stroke="#2a7aad" stroke-opacity=".4"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#2a7aad" stroke-width="2"/>
<line x1="52" y1="58" x2="172" y2="58" stroke="#2a7aad" stroke-width="3" filter="url(#gl)"/>
<g class="ln" style="animation-delay:0.15s"><text x="52" y="96" class="dim"><tspan class="gr">$</tspan> kubectl get tools -n billing <tspan class="fainter"># what I reach for</tspan></text></g>
<g class="ln" style="animation-delay:0.25s">
<text x="52" y="118" xml:space="preserve" style="font-size:14px"><tspan class="cy">runtime</tspan><tspan class="fainter">.......</tspan> <tspan class="fg">Go · Kubernetes · containers</tspan></text>
</g>
<g class="ln" style="animation-delay:0.33s">
<text x="52" y="146" xml:space="preserve" style="font-size:14px"><tspan class="cy">data</tspan><tspan class="fainter">..........</tspan> <tspan class="fg">Postgres · Kafka · Redis</tspan></text>
</g>
<g class="ln" style="animation-delay:0.41s">
<text x="52" y="174" xml:space="preserve" style="font-size:14px"><tspan class="cy">apis</tspan><tspan class="fainter">..........</tspan> <tspan class="fg">gRPC · Connect · REST</tspan></text>
</g>
<g class="ln" style="animation-delay:0.49s">
<text x="52" y="202" xml:space="preserve" style="font-size:14px"><tspan class="cy">devx</tspan><tspan class="fainter">..........</tspan> <tspan class="fg">CI/CD · local loops · green merges</tspan></text>
</g>
<g class="ln" style="animation-delay:0.57s">
<text x="52" y="230" xml:space="preserve" style="font-size:14px"><tspan class="cy">ops</tspan><tspan class="fainter">...........</tspan> <tspan class="fg">Prometheus · Grafana · alerts that page</tspan></text>
</g>
<g class="ln" style="animation-delay:0.65s">
<text x="52" y="258" xml:space="preserve" style="font-size:14px"><tspan class="cy">also</tspan><tspan class="fainter">..........</tspan> <tspan class="fg">Python · Java when the job asks</tspan></text>
</g>
<path d="M16 0V320M864 0V320" fill="none" stroke="#2a7aad" stroke-width="1.2"/>
