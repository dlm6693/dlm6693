<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" role="img" aria-labelledby="t d">
<title id="t">CoreWeave</title>
<desc id="d">Building the billing platform at CoreWeave</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#7a7a8c}.cy{fill:#3db8ff}.fg{fill:#c8c8d4}.gr{fill:#3dd68c}.wh{fill:#f0f0f8}.fainter{fill:#3a3a48}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes type{from{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes meter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.typing{animation:type .7s steps(10) .25s both}
.name{animation:rise .55s ease-out .55s both}
.meter{transform-origin:left center;animation:meter .8s ease-out 1.1s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3db8ff" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".2"/></pattern>
<filter id="sglow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M16 -40V120M864 -40V120" fill="none" stroke="#3db8ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="80" fill="#050508"/>
<rect x="16" y="0" width="848" height="80" fill="url(#grid)"/>
<g class="ln" style="animation-delay:2.50s"><text class="fg" x="52" y="18"><tspan class="cy">&gt;&gt;</tspan> shipping meters &amp; ledgers at <tspan class="cy" font-weight="700">COREWEAVE</tspan></text></g>
<g class="ln" style="animation-delay:2.8s">
<text x="52" y="56" class="gr">$</text>
<rect class="cursor" x="70" y="43" width="10" height="17" fill="#3db8ff"/>
<rect class="cursor" x="70" y="43" width="10" height="17" fill="#3db8ff" filter="url(#sglow)"/>
</g>
<rect x="16" y="0" width="848" height="64" fill="url(#scan)"/>
<path d="M16 0V80M864 0V80" fill="none" stroke="#3db8ff" stroke-width="1.2"/>
<g fill="none" stroke="#3db8ff" stroke-width="2"></g>
</svg>
