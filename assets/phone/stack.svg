<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" role="img" aria-labelledby="t d">
<title id="t">Stack</title>
<desc id="d">runtime: Go · Kubernetes · containers; data: Postgres · Kafka · Redis; apis: gRPC · Connect · REST; devx: CI/CD · local loops · clear APIs; ops: Prometheus · Grafana · pipelines; also: Python · Java when the job asks</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8b9bb0}.cy{fill:#6ec8ff}.fg{fill:#d7e2ef}.gr{fill:#5ddea6}.wh{fill:#f4f8ff}.fainter{fill:#3d4a5c}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6ec8ff" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M10 -40V440M430 -40V440" fill="none" stroke="#6ec8ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="10" y="0" width="420" height="400" fill="#070b12"/>
<rect x="10" y="0" width="420" height="400" fill="url(#grid)"/>
<text x="28" y="44" font-weight="700" fill="#6ec8ff" filter="url(#g)" opacity=".8" style="font-size:20px">~/</text>
<text x="28" y="44" font-weight="700" style="font-size:20px"><tspan class="cy">~/</tspan><tspan class="wh">stack</tspan></text>
<text x="412" y="44" text-anchor="end" letter-spacing="2" fill="#6a7a8f" style="font-size:12px">// 02</text>
<line x1="28" y1="58" x2="412" y2="58" stroke="#6ec8ff" stroke-opacity=".4"/>
<line x1="28" y1="58" x2="148" y2="58" stroke="#6ec8ff" stroke-width="2"/>
<line x1="28" y1="58" x2="148" y2="58" stroke="#6ec8ff" stroke-width="3" filter="url(#gl)"/>
<g class="ln" style="animation-delay:0.15s"><text x="28" y="90" class="dim" style="font-size:12px"><tspan class="gr">$</tspan> kubectl get tools <tspan class="fainter"># day-to-day</tspan></text></g>
<g class="ln" style="animation-delay:0.25s">
<text x="28" y="118" class="cy" style="font-size:11px">runtime</text>
<text x="28" y="134" class="fg" style="font-size:12px">Go · Kubernetes · containers</text>
</g>
<g class="ln" style="animation-delay:0.33s">
<text x="28" y="158" class="cy" style="font-size:11px">data</text>
<text x="28" y="174" class="fg" style="font-size:12px">Postgres · Kafka · Redis</text>
</g>
<g class="ln" style="animation-delay:0.41s">
<text x="28" y="198" class="cy" style="font-size:11px">apis</text>
<text x="28" y="214" class="fg" style="font-size:12px">gRPC · Connect · REST</text>
</g>
<g class="ln" style="animation-delay:0.49s">
<text x="28" y="238" class="cy" style="font-size:11px">devx</text>
<text x="28" y="254" class="fg" style="font-size:12px">CI/CD · local loops · clear APIs</text>
</g>
<g class="ln" style="animation-delay:0.57s">
<text x="28" y="278" class="cy" style="font-size:11px">ops</text>
<text x="28" y="294" class="fg" style="font-size:12px">Prometheus · Grafana · pipelines</text>
</g>
<g class="ln" style="animation-delay:0.65s">
<text x="28" y="318" class="cy" style="font-size:11px">also</text>
<text x="28" y="334" class="fg" style="font-size:12px">Python · Java when the job asks</text>
</g>
<path d="M10 0V400M430 0V400" fill="none" stroke="#6ec8ff" stroke-width="1.2"/>
<g fill="none" stroke="#6ec8ff" stroke-width="2"></g>
