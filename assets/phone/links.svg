<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-labelledby="t d">
<title id="t">links</title>
<desc id="d">links</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#9a9890}.cy{fill:#e8b84b}.fg{fill:#e8e6e0}.gr{fill:#6ee79a}.wh{fill:#fff8e7}.fainter{fill:#4d4b45}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8b84b" stroke-opacity=".06"/></pattern>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M10 -40V160M430 -40V160" fill="none" stroke="#e8b84b" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="10" y="0" width="420" height="120" fill="#0c0c0b"/>
<rect x="10" y="0" width="420" height="120" fill="url(#grid)"/>
<text x="28" y="44" font-weight="700" fill="#e8b84b" filter="url(#g)" opacity=".8" style="font-size:20px">~/</text>
<text x="28" y="44" font-weight="700" style="font-size:20px"><tspan class="cy">~/</tspan><tspan class="wh">links</tspan></text>
<text x="412" y="44" text-anchor="end" letter-spacing="2" fill="#75736c" style="font-size:12px">// 02</text>
<line x1="28" y1="58" x2="412" y2="58" stroke="#e8b84b" stroke-opacity=".4"/>
<line x1="28" y1="58" x2="148" y2="58" stroke="#e8b84b" stroke-width="2"/>
<line x1="28" y1="58" x2="148" y2="58" stroke="#e8b84b" stroke-width="3" filter="url(#gl)"/>
<g class="ln" style="animation-delay:0.15s"><text x="28" y="96" class="dim" style="font-size:13px"><tspan class="gr">$</tspan> open --url …</text></g>
<path d="M10 0V120M430 0V120" fill="none" stroke="#e8b84b" stroke-width="1.2"/>
<g fill="none" stroke="#e8b84b" stroke-width="2"></g>
</svg>
