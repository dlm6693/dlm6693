<desc id="d">Senior engineer on CoreWeave billing — mostly Go on Kubernetes. Not a tools team. Still the one asking why that alert did not page. Earlier: AWS boto3 maintainer, then senior engineer at The New York Times. NYC native. Dry humor. Freshly caffeinated preferred.</desc>
