<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 440 480" role="img" aria-labelledby="t d">
<title id="t">About</title>
<desc id="d">I build backend systems for AI infrastructure billing at CoreWeave. Previously maintained the AWS Python SDK (boto3) and worked at The New York Times. Mostly Python, Java, and Go — shipping the boring reliable stuff that keeps money and meters honest.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
